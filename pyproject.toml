[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-control-tower"
version = "1.0.0"
description = "Synthetic manufacturing OEE, quality, SPC and predictive-maintenance decision-support platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Murat Mirac Gedik" }]
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "pandas==3.0.5",
  "prometheus-client==0.26.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "reportlab==5.0.1",
  "scikit-learn==1.9.0",
  "shap==0.51.0",
  "SQLAlchemy==2.0.52",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]
postgres = ["psycopg[binary]==3.3.4"]

[project.scripts]
manufacturing-pipeline = "manufacturing_ct.pipeline:main"
manufacturing-api = "manufacturing_ct.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["manufacturing_ct"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

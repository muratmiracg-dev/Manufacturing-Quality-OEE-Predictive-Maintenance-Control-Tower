apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manufacturing-recommendation-api
  namespace: manufacturing-analytics
spec:
  podSelector:
    matchLabels:
      app: manufacturing-recommendation-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

